# Local stack: the Floci AWS emulator (API Gateway, Lambda, S3, SQS, DynamoDB), the GPU worker, and monitoring.
#   docker compose up -d floci                 then `make infra-up` (Terraform on Floci)
#   docker compose --profile worker up -d      the worker (Ollama runs on the host, for the GPU)
#   docker compose --profile obs up -d         Prometheus with the alert rules
name: vde

services:
  floci:
    image: floci/floci:2.3.0
    ports: ["127.0.0.1:4566:4566"]
    environment:
      FLOCI_HOSTNAME: floci
      # Lambda functions run in real containers on this network, next to Floci
      FLOCI_SERVICES_DOCKER_NETWORK: vde_default
      FLOCI_SERVICES_UI_ENABLED: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      # the image has bash but neither curl nor wget: an HTTP request over bash's /dev/tcp
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4566 && printf 'GET /_floci/health HTTP/1.0\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *' 200 '* ]]"]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    profiles: [worker]
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      VDE_AWS_ENDPOINT_URL: http://floci:4566
      VDE_QUEUE_URL: ${VDE_QUEUE_URL:-}
      VDE_BUCKET: ${VDE_BUCKET:-}
      VDE_TABLE: ${VDE_TABLE:-vde-jobs}
      VDE_EXTRACTOR: ${VDE_EXTRACTOR:-vlm}
      VDE_VLM_MODEL: ${VDE_VLM_MODEL:-qwen3-vl:8b-instruct}
      VDE_OLLAMA_URL: http://host.docker.internal:11434
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:9108:9108"]
    depends_on:
      floci: { condition: service_healthy }

  prometheus:
    profiles: [obs]
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports: ["127.0.0.1:9090:9090"]

networks:
  default:
    name: vde_default
